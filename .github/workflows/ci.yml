name: CI

# Fast run on every pull request and push to main: format, clippy with
# warnings as errors, and the tests (render tests on Mesa lavapipe, a
# software Vulkan driver). A full run (later: long tests marked
# #[ignore = "full run: ..."]) starts by hand (Actions > CI > Run workflow)
# or with the pull-request label `full-ci`, after asking the maintainer.
#
# What keeps it fast (AGENTS.md, "Checks to run before a pull request"):
# - cargo-nextest runs every test binary at once instead of one after the
#   other, so the slowest test sets the time, not the sum of the crates;
# - our own crates are built with opt-level 1 for the tests (debug
#   assertions and overflow checks stay on), the dependencies at 2 as in
#   Cargo.toml;
# - no debug info: a smaller cache that restores faster, quicker links
#   (a panic still names its file and line);
# - the Mesa packages come from a cache instead of apt.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_OPT_LEVEL: "1"
  CARGO_PROFILE_TEST_OPT_LEVEL: "1"
  FULL: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format
        run: rustup component add rustfmt && cargo fmt --all --check

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select stable Rust
        run: rustup update stable && rustup default stable && rustup component add clippy
      - name: Cache the Cargo build
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Cache the Mesa packages
        id: mesa
        uses: actions/cache@v4
        with:
          path: ~/mesa-debs
          key: mesa-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}
      - name: Install Mesa lavapipe (software Vulkan for the render tests)
        run: |
          if [ "${{ steps.mesa.outputs.cache-hit }}" != "true" ]; then
            sudo apt-get update -qq
            mkdir -p ~/mesa-debs
            sudo apt-get install -y -qq --no-install-recommends --download-only \
              -o Dir::Cache::Archives="$HOME/mesa-debs" mesa-vulkan-drivers
            sudo chown -R "$USER" ~/mesa-debs
          fi
          # Skip the man page index rebuild that dpkg triggers.
          sudo rm -f /var/lib/man-db/auto-update
          sudo dpkg -i ~/mesa-debs/*.deb > /dev/null
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: |
          if [ "$FULL" = "true" ]; then
            cargo nextest run --profile ci --locked --workspace --all-targets --run-ignored all
          else
            cargo nextest run --profile ci --locked --workspace --all-targets
          fi
      - name: Keep the rendered images when a render test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-test
          path: target/render-test/
          if-no-files-found: ignore
