[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
murmel-mesh = { path = "crates/murmel-mesh" }
murmel-engine = { path = "crates/murmel-engine" }
murmel-render = { path = "crates/murmel-render" }
murmel-tools = { path = "crates/murmel-tools" }
murmel-mcp = { path = "crates/murmel-mcp" }
bytemuck = { version = "1.25", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = ["accesskit", "wgpu", "wayland", "x11", "persistence"] }
egui = "0.37"
egui-wgpu = "0.37"
fluent-bundle = "0.16"
glam = "0.34"
png = "0.18"
pollster = "1.0"
quick-xml = "0.42"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
# File checks (the user's choice, 2026-11-24): CC0-1.0 OR Apache-2.0,
# with rayon-core, crossbeam-deque/-epoch and constant_time_eq (MIT OR
# Apache-2.0, CC0) for hashing on every core. SHA-256 stays
# to check older evidence and sessions.
blake3 = { version = "1.8", features = ["rayon"] }
sha2 = "0.10"
toml = "1.2"
unic-langid = "0.9"
wgpu = "30"
# CPU 2D renderer for the overlays of exported pictures (legend, triad);
# the same versions egui already uses, Apache-2.0 OR MIT.
vello_cpu = { version = "0.2", default-features = false, features = ["std", "text", "u8_pipeline"] }
skrifa = "0.44"
# GIF movies (export.movie): MIT OR Apache-2.0, with color_quant (MIT).
gif = "0.14"
base64 = "0.23"
flate2 = "1.1"
# The end of an array's text in the streaming .vtu reader: Unlicense OR
# MIT, already a dependency of quick-xml.
memchr = "2.8"
# Peak memory for `murmel bench` on macOS as on Linux (getrusage): MIT,
# with bitflags, cfg-if and libc (MIT OR Apache-2.0), already dependencies.
nix = { version = "0.31", default-features = false, features = ["resource"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.test.package."*"]
opt-level = 2

# The tests run the mesh and the engine's numerics (preview grids, cuts,
# streamlines) on real meshes; unoptimised they take minutes, at opt-level 1
# seconds. Debug assertions and overflow checks stay on. The other crates
# stay at 0: they build faster and run little.
[profile.test.package.murmel-mesh]
opt-level = 1

[profile.test.package.murmel-engine]
opt-level = 1
