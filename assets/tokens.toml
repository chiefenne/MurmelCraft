# Design tokens of MurmelCraft (UI spec, "Design tokens, fonts and icons").
# egui's Visuals and the wgpu viewport both read this file; no colour is
# written anywhere else. Colours are sRGB hex.

[dark]
bg_app = "#16181B"
bg_panel = "#1E2125"
bg_raised = "#272B30"
line = "#32373E"
text_primary = "#E7E9EC"
text_secondary = "#A2A9B2"
viewport_top = "#30353C"
viewport_bottom = "#191C20"
accent = "#DE74B6"
status_ok = "#4CBB7A"
status_warn = "#E5B54A"
status_error = "#EF6B5B"

[light]
bg_app = "#EEF0F3"
bg_panel = "#FFFFFF"
bg_raised = "#F5F6F8"
line = "#D7DBE0"
text_primary = "#1C2026"
text_secondary = "#5A626C"
viewport_top = "#F8F9FB"
viewport_bottom = "#D9DEE4"
accent = "#AD3285"
status_ok = "#2E8A53"
status_warn = "#A9760F"
# Darkened from #C7402F (4.38:1 on bg_app) so the status bar's error
# text reaches WCAG AA, 4.66:1 (2026-11-23, accessibility pass).
status_error = "#C03D2D"

[mesh]
# The default colour of the mesh (colour mode solid), decided by the
# maintainer 2026-11-23: the green of a reference screenshot, sampled
# from its lit faces (#6EC449) and set so that a face towards the
# viewer shades to it. Users change it in Settings (settings.set_colors).
solid = "#6EC64A"
# Twelve hues of our own, OKLCH at hue steps of 30 degrees from 20,
# lightness 0.74 and 0.68 alternating, chroma 0.12. Ordered so that the
# first patches differ most, also under simulated protanopia,
# deuteranopia and tritanopia (each next hue is the farthest from those
# before it; see the theme tests).
patch = [
  "#D38151", "#7EABF6", "#D2A249", "#ED8B8B", "#988BDD", "#CC91DA",
  "#32B08D", "#CF78A3", "#24C1C9", "#81BD74", "#9D9E3D", "#32A5D4",
]
# Edges take the face colour darkened by this fraction.
edge_darken = 0.45
# The magenta of the logo (assets/logo), measured from the supplied image.
# The accents share its hue (OKLCH 0.53 0.18 -16): light uses it as is,
# dark lifts it to lightness 0.70 so text on both passes WCAG AA.
logo = "#AD3285"
# Axis triad: X red, Y green, Z blue (UI spec, Axis triad).
axis_x = "#E5534B"
axis_y = "#57AB5A"
axis_z = "#539BF5"
# Selected items: faces mix this much of the selection colour into
# their own, and their edges take it whole.
selection = "#FF4FB8"
selection_mix = 0.2
# Cell quality (colour by quality): a sequential ramp of our own from
# good to bad, OKLCH lightness 0.94 down to 0.44 in even steps, hue 105
# (pale yellow) to 25 (deep red), chroma rising to the sRGB gamut. The
# falling lightness keeps the order readable under colour-vision
# deficiencies (see the theme tests).
quality = [
  "#F2EFB8", "#EAD78F", "#E5BD65", "#E1A13B", "#DB8406",
  "#CD6A01", "#BE4F04", "#B22C01", "#9E0117",
]

# Field colouring (thread "Show FoehnCraft field results", 2026-11-24).
# Faces without a value (a field only the boundary has, seen on a cut)
# take `none`, a neutral grey between the two viewports' ends; mesh
# edges over a field take `edge`, dark so they read on every colour map;
# contour lines mix `line_mix` of `line` over the field's colours. Users
# change them with settings.set_colors, "field".
[mesh.field]
none = "#8C9198"
edge = "#2B2F35"
line = "#0E1012"
line_mix = 0.85
# The mesh's feature edges while slices or iso-surfaces show: a mid grey
# that reads on both the dark and the light viewport without competing
# with the colours inside.
outline = "#7A8089"
# Vector arrows drawn in a solid colour: a light cool grey that stands
# out against the dark viewport and against the coloured slices.
arrow = "#E8ECF2"

# Patch roles (UI spec, Colour by): wall grey, inlet blue, outlet orange,
# symmetry green, interface violet, unspecified sand. Searched in OKLCH
# within those hue families for the largest smallest OKLab distance
# under the three colour-vision simulations (0.11).
[mesh.role]
wall = "#95999F"
inlet = "#5081BE"
outlet = "#F78340"
symmetry = "#8EE297"
interface = "#D4B4E8"
unspecified = "#88775D"

# Cell types: polyhedron teal, prism amber, hexahedron slate, tetrahedron
# rose, pyramid lime; found the same way (0.12).
[mesh.kind]
polyhedron = "#6ACBC0"
prism = "#E79504"
hexahedron = "#7C90AF"
tetrahedron = "#9E5D62"
pyramid = "#C9DB72"

# The clip plane's handles (the slide arrow and the tilt arcs) are drawn
# as shaded tubes: the sides turned from the light mix in up to
# shade_mix of shade, the highlight up to shine_mix of shine.
[gizmo]
shade = "#140A12"
shade_mix = 0.6
shine = "#FFFFFF"
shine_mix = 0.55

# The handles' colours per theme (users change them with
# settings.set_colors, "gizmo"). The arrow takes the accent; the tilt
# arcs and their rotation plane the accent turned 40 degrees towards
# violet in OKLCH at the same lightness and chroma (dark L 0.70 C 0.15,
# light L 0.53 C 0.18), so they differ a little from the arrow and stay
# in its family (maintainer's Mac test, 2026-11-24).
[gizmo.dark]
slide = "#DE74B6"
tilt = "#B384EB"

[gizmo.light]
slide = "#AD3285"
tilt = "#8348BE"

# Measurements and probes, drawn over the viewport (thread "Measure and
# probe the mesh", 2026-11-24). Lines take an amber, probes a sky blue,
# OKLCH hues 80 and 230, both away from the green mesh (hue 140), the
# magenta accent and the violet tilt arcs; dark L 0.82, light L 0.55, so
# each reads on its theme's viewport. The halo is drawn under them, so
# they also read on a face of their own colour. Users change them with
# settings.set_colors, "measure".
[measure.dark]
line = "#F2BE4A"
probe = "#5EC4F2"
halo = "#101214"

[measure.light]
line = "#A06A00"
probe = "#1C7BB0"
halo = "#FFFFFF"
