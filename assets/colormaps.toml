at = [0.0, 0.143, 0.285, 0.429, 0.571, 0.714, 0.857, 1.0]
stops = [
  "#4747DB", "#00005C", "#00FFFF", "#008000", "#FFFF00", "#FF6100",
  "#6B0000", "#E04D4D",
]

