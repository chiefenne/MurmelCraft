[package]
name = "kraxn-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Kraxn, the installer of MurmelCraft, KoflCraft and FoehnCraft: plans, downloads, checks and installs (no window)"

[dependencies]
flate2.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar = "0.4"
toml.workspace = true
# HTTPS with the system's certificate store (so company proxies with their
# own root certificate work) and the proxy of HTTPS_PROXY / ALL_PROXY.
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier"] }
zip = { version = "9.9", default-features = false, features = ["deflate-flate2"] }

[lints]
workspace = true
