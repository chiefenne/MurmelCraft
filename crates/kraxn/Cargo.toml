[package]
name = "kraxn"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Kraxn, the installer of MurmelCraft, KoflCraft and FoehnCraft (window, text mode and plan files)"

[[bin]]
name = "kraxn"
path = "src/main.rs"

[dependencies]
png.workspace = true
eframe.workspace = true
egui.workspace = true
rfd = "0.18"
serde.workspace = true
toml.workspace = true
fluent-bundle.workspace = true
kraxn-core = { path = "../kraxn-core" }
serde_json.workspace = true
unic-langid.workspace = true

[lints]
workspace = true

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe", "wgpu"] }
flate2.workspace = true
tar = "0.4"
